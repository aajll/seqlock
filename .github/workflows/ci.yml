name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (debug + tests)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      # TSAN and ASAN are mutually exclusive, so this is a dedicated job with
      # only the thread sanitizer. It exercises the concurrent torn-read test
      # (design §7 #5); the library auto-selects its race-free payload copy
      # under TSAN, so a clean run proves the synchronisation, not luck.
      - name: Configure (debug + thread sanitizer)
        run: meson setup build-tsan --buildtype=debug -Dbuild_tests=true -Db_sanitize=thread

      - name: Build
        run: meson compile -C build-tsan

      - name: Test
        run: meson test -C build-tsan --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson, ninja and gcovr
        run: uv tool install meson && uv tool install ninja && uv tool install gcovr

      # -fprofile-update=atomic makes gcov's counter increments atomic. The
      # concurrent tests exercise the same instrumented lines from multiple
      # threads; with the default non-atomic counters those updates race, the
      # arc counts become mutually inconsistent, and gcov's flow-graph solver
      # derives negative branch counts that corrupt the report. Atomic updates
      # keep the counters consistent so coverage is accurate.
      - name: Configure (coverage)
        run: meson setup build-cov --buildtype=debug -Dbuild_tests=true -Db_coverage=true -Dc_args=-fprofile-update=atomic

      - name: Build
        run: meson compile -C build-cov

      - name: Test
        run: meson test -C build-cov

      # Gate on 100% line and branch coverage of the library sources, merged
      # across every backend build. The reader retry branches are reached
      # deterministically by test_seqlock_retry, not by the concurrent tests.
      - name: Coverage report (100% line and branch gate)
        run: |
          gcovr --root . --filter 'src/' --filter 'include/' \
                --fail-under-line 100 --fail-under-branch 100 --print-summary

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Cross-compile the library with TI's C2000 code generation tools, a target
  # with CHAR_BIT == 16 and a 16-bit int, under both object ABIs. The compiler
  # defines __STDC_NO_ATOMICS__ and not __GNUC__, so this builds the
  # uniprocessor backend. The installer is checksum-pinned and the toolchain
  # is cached.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done

  # ---------------------------------------------------------------------------
  # Formatting, with the clang-format release pinned in scripts/format.sh.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # MISRA C:2023 analysis with misch, once per atomic backend. CI fails on any
  # finding outside that backend's baseline in analysis/baseline/.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      # Ubuntu 24.04 ships cppcheck 2.13, whose findings differ from current
      # releases. The Homebrew bottle is current; brew is preinstalled.
      - name: Install cppcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cppcheck --version

      - name: Install meson, ninja and misch
        run: uv tool install meson && uv tool install ninja && uv tool install misch

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse (__atomic backend)
        run: misch run --baseline -v

      - name: Analyse (C11 backend)
        run: misch run --baseline --profile c11 -v

      - name: Analyse (uniprocessor backend)
        run: misch run --baseline --profile no_atomics -v

      - name: Deviation record
        run: misch deviations
